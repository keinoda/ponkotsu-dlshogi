name: Build and Publish Docker Image to GHCR

on:
  push:
    branches:
      - wcsc36
  pull_request:
    branches:
      - wcsc36

jobs:
  build-and-push:
    runs-on: self-hosted

    permissions:
      packages: write
      contents: read

    steps:
      # リポジトリのチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v6

      # Docker Buildxのセットアップ
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GitHub Container Registryへのログイン
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerイメージのビルドとプッシュ
      - name: Build and push Docker image
        id: build_push_latest
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ponkotsu_wcsc33:latest

      - name: Retry build and push Docker image
        if: steps.build_push_latest.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ponkotsu_wcsc33:latest

      - name: Build and push Docker development image
        id: build_push_develop
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: .
          file: ./docker/Dockerfile.develop
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ponkotsu_wcsc33:develop

      - name: Retry build and push Docker development image
        if: steps.build_push_develop.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.develop
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ponkotsu_wcsc33:develop
