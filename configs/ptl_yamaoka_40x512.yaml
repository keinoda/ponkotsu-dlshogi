# 山岡氏 (本家 dlshogi) の現行本命構成の再現用 Lightning 設定
#   モデル: 40ブロック512フィルタ ResNet+Transformer (WCSC35 モデル = policy_value_network_exp___i)
#           213.9M params (fcl は本家未公表のためデフォルト 256)
#   学習:   実効バッチ 4096 (本家の 40b512 学習と同等)、AdamW + cosine (本家 config.yaml のレシピ)
#
# 実行:
#   python3 -m dlshogi.ptl fit --config configs/ptl_yamaoka_40x512.yaml
# 中断から再開:
#   python3 -m dlshogi.ptl fit --config configs/ptl_yamaoka_40x512.yaml --ckpt_path <last.ckpt>
#
# 忠実な再現には入玉特徴量ビルドが必要 (本家の現行モデルは入玉特徴量あり):
#   NYUGYOKU_FEATURES=1 pip3 install ./external/dlshogi
#   (USI エンジンも NYUGYOKU_FEATURES=1 make。特徴量数はビルドフラグに自動追従する)
#
# メモリ注意: 学習データは全局面をメモリ展開する (再現データ 1 ファイル ≈ 2.5 億局面 ≈ RAM 30GB)。
# RAM に乗らない場合はファイル数を分割し --ckpt_path で継いで学習する。
seed_everything: 0
trainer:
  max_epochs: 1
  precision: 16-mixed          # H100 なら bf16-mixed も可
  accelerator: gpu
  devices: 1                   # 複数 GPU があれば増やす (DDP)
  accumulate_grad_batches: 4   # 1024 x 4 = 実効バッチ 4096
  gradient_clip_val: 10.0
  val_check_interval: 5000
  limit_val_batches: 200
  default_root_dir: /workspace/models/yamaoka40x512
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_top_k: -1
        save_on_train_epoch_end: true
        monitor: val/loss
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
model:
  network: exp___i40x512_fcl256
  val_lambda: 0.333
  model_filename: model-yamaoka40x512-{epoch:03}
data:
  train_files:
    # RAM に応じて追加する (27 億局面規模 = 000〜010 の 11 ファイル)
    - /workspace/data/prelearn/generic_ponkostu_wcsc36_Prelearning_data_000.hcpe
  val_files:
    - /workspace/test/floodgate.hcpe   # 本家公開の評価用データセット (手順書 5-2)
  batch_size: 1024
  val_batch_size: 1024
  use_average: true
  use_evalfix: true
  temperature: 1.0
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-4
    betas:
      - 0.9
      - 0.999
    eps: 1e-08
    weight_decay: 1e-2
lr_scheduler:
  class_path: dlshogi.lr_scheduler.CosineLRScheduler
  init_args:
    # t_initial は総 optimizer ステップ数に合わせる: 総局面数 / 4096
    # 例: 1 ファイル (2.5億) → 60000 / 11 ファイル (27億) → 660000
    t_initial: 60000
    lr_min: 1e-8
    warmup_t: 1000
    warmup_lr_init: 1e-7
    warmup_prefix: true
